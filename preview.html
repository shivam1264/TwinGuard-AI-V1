<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Center Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview.jsx"></script>
    <script>
      setTimeout(() => {
        const cards = document.querySelectorAll('.rounded-2xl.bg-white');
        let report = [];
        cards.forEach((c, i) => {
          const r = c.getBoundingClientRect();
          const overX = c.scrollWidth - c.clientWidth;
          const overY = c.scrollHeight - c.clientHeight;
          if (overX > 0 || overY > 0) {
            report.push(`CARD#${i}[${(c.textContent || '').trim().slice(0, 22)}] w=${Math.round(r.width)} overX=${overX} overY=${overY}`);
          }
        });
        let spills = [];
        cards.forEach((c, i) => {
          const cr = c.getBoundingClientRect();
          const cs = getComputedStyle(c);
          const right = cr.right - parseFloat(cs.paddingRight) - parseFloat(cs.borderRightWidth);
          const bottom = cr.bottom - parseFloat(cs.paddingBottom) - parseFloat(cs.borderBottomWidth);
          c.querySelectorAll('*').forEach((el) => {
            const er = el.getBoundingClientRect();
            if (er.width > 0 && er.right > right + 1.5) spills.push(`RIGHT-SPILL card#${i} <${el.tagName.toLowerCase()}> +${Math.round(er.right - right)}`);
            if (er.height > 0 && er.bottom > bottom + 1.5) spills.push(`BOTTOM-SPILL card#${i} <${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ').slice(0, 2).join('.')}> +${Math.round(er.bottom - bottom)}`);
          });
        });
        const root = document.querySelector('.overflow-y-auto');
        // Header overflow check (nowrap button row)
        let headSpill = [];
        const hdr = document.querySelector('header');
        if (hdr) {
          const hr = hdr.getBoundingClientRect();
          hdr.querySelectorAll(':scope > div').forEach((el) => {
            const er = el.getBoundingClientRect();
            if (er.right > hr.right + 1.5) headSpill.push(`HEADER-SPILL +${Math.round(er.right - hr.right)}`);
            if (er.left < hr.left - 1.5) headSpill.push(`HEADER-LEFT-SPILL ${Math.round(hr.left - er.left)}`);
          });
          const h1 = hdr.querySelector('h1');
          if (h1 && h1.scrollWidth > h1.clientWidth + 1) headSpill.push(`H1-CLIPPED ${h1.scrollWidth}>${h1.clientWidth}`);
        }
        document.title = `VP=${window.innerWidth}x${window.innerHeight} ROOTscroll=${root ? root.scrollHeight : '?'} ROOTw=${root ? root.scrollWidth + '/' + root.clientWidth : '?'} || ` +
          (report.length ? report.join(' ## ') : 'no-card-overflow') + ' || ' + (spills.length ? [...new Set(spills)].slice(0, 8).join(' ## ') : 'no-spill') +
          ' || ' + (headSpill.length ? headSpill.join(' ## ') : 'header-ok');
      }, 2000);
    </script>
  </body>
</html>
