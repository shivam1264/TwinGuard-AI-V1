<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="fountainGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="110" fill="url(#skyGrad)"/>

  <!-- Background Academic Building -->
  <rect x="30" y="55" width="260" height="45" rx="3" fill="url(#bldGrad)"/>
  <!-- Windows -->
  <g fill="#0284c7" opacity="0.75">
    <rect x="40" y="62" width="16" height="10" rx="1"/>
    <rect x="62" y="62" width="16" height="10" rx="1"/>
    <rect x="84" y="62" width="16" height="10" rx="1"/>
    <rect x="106" y="62" width="16" height="10" rx="1"/>
    <rect x="135" y="60" width="22" height="14" rx="1" fill="#38bdf8"/>
    <rect x="165" y="62" width="16" height="10" rx="1"/>
    <rect x="187" y="62" width="16" height="10" rx="1"/>
    <rect x="209" y="62" width="16" height="10" rx="1"/>
    <rect x="231" y="62" width="16" height="10" rx="1"/>
    <rect x="253" y="62" width="16" height="10" rx="1"/>

    <rect x="40" y="77" width="16" height="12" rx="1"/>
    <rect x="62" y="77" width="16" height="12" rx="1"/>
    <rect x="84" y="77" width="16" height="12" rx="1"/>
    <rect x="106" y="77" width="16" height="12" rx="1"/>
    <rect x="135" y="77" width="22" height="23" rx="1" fill="#0284c7"/>
    <rect x="165" y="77" width="16" height="12" rx="1"/>
    <rect x="187" y="77" width="16" height="12" rx="1"/>
    <rect x="209" y="77" width="16" height="12" rx="1"/>
    <rect x="231" y="77" width="16" height="12" rx="1"/>
    <rect x="253" y="77" width="16" height="12" rx="1"/>
  </g>

  <!-- Green Lawn Ground -->
  <ellipse cx="160" cy="220" rx="220" ry="130" fill="url(#grassGrad)"/>

  <!-- Paved Pathways -->
  <path d="M 0 160 Q 160 140 320 160 L 320 185 Q 160 165 0 185 Z" fill="#e2e8f0" opacity="0.9"/>
  <path d="M 145 100 L 175 100 L 195 240 L 125 240 Z" fill="#f1f5f9" opacity="0.85"/>

  <!-- Circular Assembly Centerpiece & Fountain Plaza -->
  <ellipse cx="160" cy="170" rx="55" ry="24" fill="#cbd5e1"/>
  <ellipse cx="160" cy="170" rx="46" ry="19" fill="#f8fafc"/>
  <ellipse cx="160" cy="170" rx="36" ry="14" fill="url(#fountainGrad)"/>
  <ellipse cx="160" cy="168" rx="20" ry="7" fill="#93c5fd" opacity="0.8"/>
  <path d="M 160 168 Q 155 145 160 140 Q 165 145 160 168" fill="#e0f2fe" opacity="0.9"/>

  <!-- Campus Trees -->
  <g>
    <!-- Left Trees -->
    <ellipse cx="25" cy="100" rx="20" ry="25" fill="#15803d"/>
    <ellipse cx="22" cy="95" rx="16" ry="20" fill="#16a34a"/>
    <ellipse cx="45" cy="110" rx="18" ry="22" fill="#166534"/>
    <ellipse cx="43" cy="106" rx="14" ry="18" fill="#22c55e"/>

    <!-- Right Trees -->
    <ellipse cx="295" cy="100" rx="20" ry="25" fill="#15803d"/>
    <ellipse cx="298" cy="95" rx="16" ry="20" fill="#16a34a"/>
    <ellipse cx="275" cy="110" rx="18" ry="22" fill="#166534"/>
    <ellipse cx="277" cy="106" rx="14" ry="18" fill="#22c55e"/>

    <!-- Foreground Flanking Shrubs -->
    <ellipse cx="80" cy="165" rx="12" ry="9" fill="#15803d"/>
    <ellipse cx="240" cy="165" rx="12" ry="9" fill="#15803d"/>
  </g>

  <!-- Assembly Marker Flag -->
  <circle cx="160" cy="150" r="4" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
</svg>
