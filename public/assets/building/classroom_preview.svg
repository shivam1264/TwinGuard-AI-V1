<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='100%' height='100%'>
  <defs>
    <linearGradient id='wall' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f8fafc'/>
      <stop offset='100%' stop-color='#e2e8f0'/>
    </linearGradient>
    <linearGradient id='floor' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#cbd5e1'/>
      <stop offset='100%' stop-color='#94a3b8'/>
    </linearGradient>
    <linearGradient id='board' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#1e293b'/>
      <stop offset='100%' stop-color='#0f172a'/>
    </linearGradient>
    <linearGradient id='desk' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#d97706'/>
      <stop offset='100%' stop-color='#b45309'/>
    </linearGradient>
  </defs>
  <!-- Background Wall -->
  <rect width='400' height='150' fill='url(#wall)'/>
  <!-- Floor with perspective -->
  <polygon points='0,150 400,150 400,240 0,240' fill='url(#floor)'/>
  <!-- Floor tiles grid -->
  <line x1='50' y1='150' x2='0' y2='240' stroke='#64748b' stroke-width='1' opacity='0.4'/>
  <line x1='130' y1='150' x2='90' y2='240' stroke='#64748b' stroke-width='1' opacity='0.4'/>
  <line x1='210' y1='150' x2='190' y2='240' stroke='#64748b' stroke-width='1' opacity='0.4'/>
  <line x1='290' y1='150' x2='290' y2='240' stroke='#64748b' stroke-width='1' opacity='0.4'/>
  <line x1='360' y1='150' x2='390' y2='240' stroke='#64748b' stroke-width='1' opacity='0.4'/>
  <!-- Windows on Left Wall with outdoor light -->
  <polygon points='10,20 60,35 60,135 10,145' fill='#e0f2fe' stroke='#0284c7' stroke-width='2'/>
  <polygon points='15,25 55,38 55,80 15,75' fill='#bae6fd'/>
  <polygon points='15,85 55,90 55,130 15,138' fill='#7dd3fc'/>
  <!-- Presentation Whiteboard / Display -->
  <rect x='110' y='25' width='180' height='90' rx='4' fill='url(#board)' stroke='#334155' stroke-width='3'/>
  <rect x='120' y='35' width='160' height='70' rx='2' fill='#1e293b'/>
  <text x='200' y='65' fill='#38bdf8' font-family='sans-serif' font-size='12' font-weight='bold' text-anchor='middle'>TWINGUARD DIGITAL TWIN</text>
  <text x='200' y='85' fill='#94a3b8' font-family='sans-serif' font-size='10' text-anchor='middle'>Classroom 204 • Capacity 50</text>
  <line x1='125' y1='118' x2='275' y2='118' stroke='#64748b' stroke-width='3'/>
  <!-- Classroom Student Desks (Row 1) -->
  <g id='desk-unit'>
    <polygon points='80,165 150,165 145,185 75,185' fill='url(#desk)' stroke='#92400e' stroke-width='1.5'/>
    <rect x='78' y='185' width='4' height='25' fill='#334155'/>
    <rect x='142' y='185' width='4' height='25' fill='#334155'/>
    <!-- Chair -->
    <rect x='98' y='152' width='34' height='15' rx='3' fill='#2563eb'/>
    <rect x='112' y='167' width='6' height='15' fill='#1e293b'/>
  </g>
  <g transform='translate(170, 0)'>
    <polygon points='80,165 150,165 145,185 75,185' fill='url(#desk)' stroke='#92400e' stroke-width='1.5'/>
    <rect x='78' y='185' width='4' height='25' fill='#334155'/>
    <rect x='142' y='185' width='4' height='25' fill='#334155'/>
    <rect x='98' y='152' width='34' height='15' rx='3' fill='#2563eb'/>
    <rect x='112' y='167' width='6' height='15' fill='#1e293b'/>
  </g>
  <!-- Foreground Desk -->
  <g transform='translate(50, 40) scale(1.1)'>
    <polygon points='80,165 160,165 154,190 74,190' fill='url(#desk)' stroke='#78350f' stroke-width='1.5'/>
    <rect x='78' y='190' width='5' height='28' fill='#1e293b'/>
    <rect x='150' y='190' width='5' height='28' fill='#1e293b'/>
    <rect x='102' y='150' width='40' height='18' rx='4' fill='#1d4ed8'/>
  </g>
  <!-- Ceiling Light Panels -->
  <rect x='130' y='4' width='60' height='8' rx='2' fill='#fef08a' opacity='0.85'/>
  <rect x='210' y='4' width='60' height='8' rx='2' fill='#fef08a' opacity='0.85'/>
</svg>