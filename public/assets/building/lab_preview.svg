<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='100%' height='100%'>
  <defs>
    <linearGradient id='labwall' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f0fdfa'/>
      <stop offset='100%' stop-color='#ccfbf1'/>
    </linearGradient>
    <linearGradient id='labfloor' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#99f6e4'/>
      <stop offset='100%' stop-color='#5eead4'/>
    </linearGradient>
  </defs>
  <rect width='400' height='140' fill='url(#labwall)'/>
  <polygon points='0,140 400,140 400,240 0,240' fill='url(#labfloor)'/>
  <!-- Lab Benches -->
  <rect x='40' y='120' width='320' height='70' rx='4' fill='#ffffff' stroke='#0f766e' stroke-width='2'/>
  <rect x='40' y='116' width='320' height='8' fill='#0d9488'/>
  <!-- Equipment: Microscopes & Flasks -->
  <rect x='70' y='85' width='25' height='32' rx='2' fill='#334155'/>
  <circle cx='82' cy='78' r='7' fill='#0284c7'/>
  <polygon points='140,116 150,95 155,95 165,116' fill='#06b6d4' opacity='0.8' stroke='#0891b2'/>
  <polygon points='180,116 190,90 195,90 205,116' fill='#f59e0b' opacity='0.8' stroke='#d97706'/>
  <!-- Fume Hood & Ventilation -->
  <rect x='240' y='30' width='110' height='86' rx='4' fill='#e2e8f0' stroke='#64748b' stroke-width='2'/>
  <rect x='250' y='50' width='90' height='60' rx='2' fill='#38bdf8' opacity='0.3'/>
  <text x='200' y='25' fill='#0f766e' font-family='sans-serif' font-size='12' font-weight='bold' text-anchor='middle'>BIOTECH &amp; RESEARCH LAB 201</text>
</svg>